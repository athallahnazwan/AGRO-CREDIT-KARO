name: Auto Sync Database Petani Karo

on:
  schedule:
    - cron: '0 * * * *' # Jalan otomatis setiap 1 jam
  workflow_dispatch:     # Bisa dijalankan manual lewat tab Actions di GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run sync script
        env:
          DB_PUSAT: ${{ secrets.DB_PUSAT }}
          DB_BERASTAGI: ${{ secrets.DB_BERASTAGI }}
          DB_TIGAPANAH: ${{ secrets.DB_TIGAPANAH }}
          DB_MEREK: ${{ secrets.DB_MEREK }}
          DB_KABANJAHE: ${{ secrets.DB_KABANJAHE }}
          DB_PAYUNG: ${{ secrets.DB_PAYUNG }}
        run: python sync.py
